name: Test

on:
  push:
    tags:
      - v*
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.0.0
          - '26'
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - coverage: true
            node: 24.0.0
            os: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          require-lockfile: true
          runtime: node@${{ matrix.node }}
          version: latest

      - name: Run typecheck
        if: ${{ matrix.coverage }}
        run: pnpm run typecheck

      - name: Run tests with coverage
        run: pnpm run test

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
